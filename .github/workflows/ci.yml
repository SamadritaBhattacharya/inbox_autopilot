name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI never touches a live mailbox or a real provider. Unit, contract, and graph-path tests
# run on fakes and recorded fixtures; the live smoke test is manual by design.
env:
  EMAIL_SURFACE: fake

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Python deps
        run: uv sync --project backend

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Contract drift guard
        # Regenerates Pydantic -> JSON Schema -> Zod and fails if a committed artifact is
        # stale. A schema change that skips regeneration must not merge: the two sides of
        # the wire would disagree at runtime, which is exactly the bug codegen prevents.
        run: |
          uv run --project backend python packages/contracts/scripts/gen.py
          node packages/contracts/scripts/gen-zod.mjs
          pnpm -C packages/contracts build
          git diff --exit-code -- packages/contracts/schema packages/contracts/src/generated

      - name: Python tests
        run: uv run --project backend pytest -q backend/tests packages/contracts/tests

      - name: JS tests
        run: pnpm -r test

      - name: Cockpit typecheck
        # `next typegen` first: route types (LayoutProps/PageProps) are generated, so a
        # bare tsc on a clean checkout fails on types that are perfectly valid.
        run: pnpm -C frontend typecheck

      - name: Cockpit build
        run: pnpm -C frontend build

      - name: Lint
        run: uv run --project backend ruff check backend packages/contracts

  # Guardrail: a provider key must never reach a shipped bundle. This job exists from day
  # one so it cannot be "added later" once there is a bundle to check.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No committed secrets
        run: |
          if git grep -nEI '(gsk_[A-Za-z0-9]{20,}|sk-or-v1-[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{30,})' -- . ':!*.example'; then
            echo "::error::A provider key pattern is committed."
            exit 1
          fi
          echo "No key patterns found."
      - name: .env is not tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked. It must stay gitignored."
            exit 1
          fi
          echo ".env is untracked."

      - name: Cockpit declares exactly one environment variable
        # The frontend needs NEXT_PUBLIC_WS_URL and nothing else. A second NEXT_PUBLIC_*
        # is how a provider key starts drifting toward the browser bundle, so it fails
        # here rather than in review.
        run: |
          found=$(git grep -hoE 'NEXT_PUBLIC_[A-Z0-9_]+' -- frontend | sort -u)
          echo "Declared: $found"
          if [ "$found" != "NEXT_PUBLIC_WS_URL" ]; then
            echo "::error::frontend/ must reference only NEXT_PUBLIC_WS_URL."
            exit 1
          fi
