[project]
name = "inbox-autopilot-backend"
version = "0.1.0"
description = "The brain: FastAPI + LangGraph manager graph over a browser-driving worker."
requires-python = ">=3.12"
dependencies = [
    "inbox-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28.1",
    "playwright>=1.62.0",
    "langgraph>=1.2.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.uv.sources]
inbox-contracts = { path = "../packages/contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]
# `live` tests reach a real provider. Excluded from the default run so the gate stays
# hermetic, fast, and free; opt in with `-m live`.
addopts = "-m 'not live and not browser'"
markers = [
    "live: reaches a real LLM provider; requires a key and is excluded by default",
    "browser: launches a real Chromium against a LOCAL fixture; excluded by default for speed",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
