<!doctype html>
<meta charset="utf-8">
<title>Compose</title>
<input id="to" type="email" placeholder="To" aria-label="To">
<input id="subject" type="text" placeholder="Subject" aria-label="Subject">
<div id="body" contenteditable="true" role="textbox" aria-label="Message Body"
     style="border:1px solid #999;min-height:120px;padding:8px"></div>
<button id="send">Send</button>
