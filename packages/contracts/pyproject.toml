[project]
name = "inbox-contracts"
version = "0.1.0"
description = "Wire contracts for Inbox Autopilot — Pydantic v2 source of truth."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src_py/inbox_contracts"]
